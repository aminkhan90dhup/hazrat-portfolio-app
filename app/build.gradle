plugins { id "com.android.application" }
android {
    namespace "io.github.aminkhan90dhup.hazratportfolio"
    compileSdk 34
    defaultConfig {
        applicationId "io.github.aminkhan90dhup.hazratportfolio"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// No external dependencies: the app uses only the Android framework (no AndroidX),
// so it builds fast and stays tiny.
